  # External Dependencies
  - id: claude-cli
    name: Claude Code CLI
    layer: external
    type: external-binary
    description: Anthropic's official Claude Code command-line interface
    dependencies: []

  - id: router-cli
    name: Claude Code Router CLI
    layer: external
