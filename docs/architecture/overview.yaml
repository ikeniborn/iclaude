data_flows:
  - id: proxy-configuration-flow
    name: Proxy Configuration Flow
    description: User provides proxy URL, script validates and saves credentials
    steps:
      - component: cli-main
        action: Receive proxy URL from user
      - component: validate-proxy-url
        action: Validate URL format and protocol
      - component: resolve-domain
        action: Optionally resolve domain to IP (HTTP only)
      - component: parse-proxy-url
        action: Extract credentials and host
      - component: credential-storage
        action: Save credentials to file (chmod 600)
      - component: configure-proxy
        action: Set environment variables
      - component: test-proxy
        action: Test connectivity
      - component: cli-main
        action: Launch Claude Code with proxy

  - id: isolated-installation-flow
    name: Isolated Installation Flow
    description: Install complete isolated environment with lockfile
    steps:
      - component: cli-main
        action: Receive --isolated-install command
      - component: isolated-environment
        action: Create .nvm-isolated directory
      - component: nvm-installer
        action: Download and install NVM
      - component: nodejs-installer
        action: Install Node.js via NVM
      - component: claude-installer
        action: Install Claude Code via npm
      - component: symlink-manager
        action: Create symlinks for binaries
      - component: save-lockfile
        action: Save versions to lockfile
      - component: cli-main
        action: Display success message

  - id: oauth-token-refresh-flow
    name: OAuth Token Refresh Flow
    description: Automatic token validation and refresh on launch
    steps:
      - component: cli-main
        action: Initiate Claude Code launch
      - component: check-oauth-token
        action: Read .credentials.json
      - component: check-token-expiration
        action: Compare expiresAt with current time + threshold
      - component: refresh-oauth-token
        action: Run claude setup-token (if expiring)
      - component: credential-storage
        action: Update .credentials.json with new token
      - component: cli-main
        action: Continue with launch

  - id: router-launch-flow
    name: Router Launch Flow
    description: Launch Claude Code via Router for alternative LLM providers
    steps:
      - component: cli-main
        action: Receive --router flag
      - component: detect-router
        action: Check router.json exists and ccr binary available
      - component: router-management
        action: Copy router.json to ~/.claude-code-router/config.json
      - component: configure-proxy
        action: Set proxy environment variables (inherited by router)
      - component: router-cli
        action: Launch ccr code (instead of claude)
      - component: router-cli
        action: Router intercepts API calls and routes to configured provider

  - id: lockfile-installation-flow
    name: Lockfile Installation Flow
    description: Reproduce exact versions from lockfile
    steps:
      - component: cli-main
        action: Receive --install-from-lockfile command
      - component: install-from-lockfile
        action: Read .nvm-isolated-lockfile.json
      - component: nvm-installer
        action: Install NVM (nvmVersion)
      - component: nodejs-installer
        action: Install Node.js (nodeVersion)
      - component: claude-installer
        action: Install Claude Code (claudeCodeVersion)
      - component: router-installer
        action: Install router (routerVersion) if not "not installed"
      - component: cli-main
        action: Display success message

  - id: microvm-launch-flow
    name: microVM Launch Flow (v2)
    description: Launch Claude Code inside Firecracker guest via SSH with virtio-blk block devices
    steps:
      - component: cli-main
        action: Receive --sandbox-microvm flag
      - component: sandbox-detect
        action: detect_kvm_support() — verify /dev/kvm accessible
      - component: sandbox-detect
        action: detect_microvm() — verify Firecracker binary, vmlinux, rootfs, nvm.img present
      - component: microvm-launcher
        action: _alloc_microvm_slot() — find free IP pair in MICRO_VM_NET_SUBNET pool; write slot-N.lock after start
      - component: microvm-launcher
        action: _ensure_slot_tap() — create TAP if missing or update IP if mismatched (sudo)
      - component: microvm-launcher
        action: create sparse workspace.img (ext4, per-session, MICRO_VM_WORKSPACE_SIZE_MB)
      - component: microvm-launcher
        action: configure_guest_environment() — write guest-env.sh to session_dir (HTTPS_PROXY, ANTHROPIC_BASE_URL, CLAUDE_CONFIG_DIR)
      - component: microvm-launcher
        action: build_microvm_config() — JSON with drives (vda/vdb/vdc), network (TAP, slot MAC), kernel + init=/usr/sbin/iclaude-guest-init
      - component: firecracker-binary
        action: Start Firecracker VMM — guest PID 1 mounts block devices, starts sshd
      - component: microvm-launcher
        action: Poll SSH connectivity on guest_ip:22 (max 30s)
      - component: microvm-launcher
        action: SCP guest-env.sh → /workspace/.iclaude-guest-env.sh
      - component: cli-main
        action: tar host→guest sync (full/path modes; excludes .nvm-isolated, .git, .claude_config, .iclaude-guest-env.sh)
      - component: cli-main
        action: SSH exec claude inside guest; unset CLAUDECODE
      - component: cli-main
        action: tar guest→host sync-back (excludes lost+found, .iclaude-guest-env.sh)
      - component: microvm-launcher
        action: stop_microvm() on EXIT trap — kill Firecracker, _free_microvm_slot, rm session_dir + socket

metrics:
  total_components: 57
  total_dependencies: 51
  max_dependency_depth: 5
  cyclomatic_complexity: medium

quality_attributes:
  maintainability: high
  modularity: high
  testability: medium
  security: high
  performance: medium
  portability: high

security_considerations:
  - description: Proxy credentials stored with chmod 600 (owner-only)
    mitigation: File permissions enforced at creation
  - description: Credentials never committed to git (.gitignore)
    mitigation: .claude_proxy_credentials in .gitignore
  - description: HTTPS proxy MitM vulnerability (undici library)
    mitigation: Recommend trusted proxies only, prefer --proxy-ca over --proxy-insecure
  - description: Password display hidden by default
    mitigation: Require --show-password flag to display
  - description: OAuth tokens persisted in .credentials.json
    mitigation: Automatic refresh within 7 days of expiration
  - description: microVM TAP interface and iptables rules require sudo
    mitigation: Setup done once during --install-microvm; runtime launch requires no elevated privileges
  - description: Interface name validation before sudo iptables commands
    mitigation: Regex check ^[a-zA-Z0-9_-]{1,15}$ in _setup_microvm_network_or_instruct()
  - description: Guest environment file (HTTPS_PROXY with credentials) pushed to guest /workspace via SCP
    mitigation: file written only to session_dir (mode 600) then SCP'd to guest; excluded from host→guest and guest→host sync; never lands in $PWD
  - description: Firecracker socket path in /tmp (world-readable directory)
    mitigation: Socket created by Firecracker with default umask; removed on cleanup

deployment:
  installation_modes:
    - isolated: Portable installation in .nvm-isolated/ directory
    - system: System-wide NVM installation
  configuration_modes:
    - isolated_config: Config in .nvm-isolated/.claude-isolated/
    - shared_config: Config in ~/.claude/
  proxy_support:
    - HTTPS (recommended, preserves domain names)
    - HTTP (optional domain-to-IP conversion)
    - SOCKS5 (NOT supported, causes crash)
  router_integration:
    - mode: opt-in
    - activation: --router flag
    - providers:
        - OpenRouter
        - DeepSeek
        - Ollama
        - Gemini
        - OpenAI
        - Volcengine
        - SiliconFlow
  microvm_sandbox:
    - mode: opt-in
    - activation: --sandbox-microvm flag or MICRO_VM_ENABLED=true
    - version: v2 (in-guest execution via SSH, virtio-blk block devices)
    - architecture: claude runs inside Firecracker guest; host manages lifecycle via SSH
    - workspace_modes:
        - full: bidirectional tar-over-SSH sync ($PWD ↔ /workspace)
        - path: sync specific MICRO_VM_WORKSPACE_PATH only
        - isolated: guest /workspace empty, no sync
    - network:
        - subnet: MICRO_VM_NET_SUBNET (default 172.16.0.0/26)
        - slots: up to 31 concurrent sessions; each gets unique IP pair + TAP
        - lockfile: ISOLATED_CONFIG_DIR/microvm-slots/slot-N.lock (FC PID)
    - os_support:
        - ubuntu: "22.04+"
        - debian: "10+"
        - altlinux: "10+"
        - wsl2: "with nested KVM enabled"
    - requires:
        - /dev/kvm (KVM hardware virtualization)
        - firecracker binary (auto-installed by --install-microvm)
        - nvm.img block image (built by --install-microvm, ~1GB)
        - TAP interface (sudo, configured once by --install-microvm; auto-updated at runtime)

skills_integration:
  skills_directory: .nvm-isolated/.claude-isolated/skills/
  available_skills:
    - structured-planning
    - bash-development
    - git-workflow
    - validation-framework
    - context-awareness
    - task-decomposition
    - thinking-framework
    - error-handling
    - rollback-recovery
