[project]
name = "iwiki-engine"
version = "0.1.0"
description = "Thin embed + vector-search engine for iwiki"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pathspec>=0.12"]

[project.scripts]
iwiki-engine = "iwiki_engine.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
