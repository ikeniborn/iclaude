read = ["iclaude", "icodex", "iwiki-mcp", "devops", "minipc", "framework"]
write = ["iclaude", "devops", "minipc", "framework"]
primary = "iclaude"

[specifications]
mode = "strict"

[code_graph]
enabled = true
languages = ["python","typescript","javascript","bash"]
auto_rebuild = "bounded"
max_rebuild_seconds = 300
max_file_bytes = 1000000
max_total_files = 20000
include_tests = false
exclude = [
  "tests/fixtures/",
  "build/",
  "*.generated.py",
  "vendor/",
  ".claude/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".superpowers/",
  ".venv/"
]
publish_mode = "mcp" 
read_mode = "mcp"  
max_snapshot_age_seconds = 86400
max_batch_rows = 5000
max_batch_bytes = 1000000
publication_session_ttl_seconds = 1800
staging_retention_seconds = 86400
staging_cleanup_limit = 100
